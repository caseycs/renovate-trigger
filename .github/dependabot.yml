version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      prefix-development: chore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/examples/complete
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      terraform-providers:
        patterns:
          - "*"
    commit-message:
      prefix: chore
  # Without this the pinned tool versions in ci.yml — and every action ref —
  # never get bumped. Dependabot's terraform ecosystem updates provider
  # constraints, not required_version or anything inside a workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
