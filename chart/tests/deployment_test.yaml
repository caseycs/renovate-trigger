suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: renders a single-replica Deployment with a Recreate strategy
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: defaults the image tag to the chart appVersion
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/caseycs/renovate-trigger:0.1.0

  - it: honours an explicit image.tag override
    set:
      image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/caseycs/renovate-trigger:1.2.3

  - it: wires the core RT_* config into the container env
    release:
      namespace: renovate
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_LOG_LEVEL
            value: info
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_BATCH_WINDOW_SECONDS
            value: "30"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_CRONJOB_NAME
            value: renovate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_GITHUB_APP_PRIVATE_KEY_FILE
            value: /etc/renovate-trigger/github-app.pem

  - it: defaults RT_CRONJOB_NAMESPACE to the release namespace
    release:
      namespace: renovate
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_CRONJOB_NAMESPACE
            value: renovate

  - it: sources RT_GITHUB_CLIENT_ID from the existing Secret
    set:
      existingSecret:
        name: rt-creds
        clientIdKey: client-id
        privateKeyKey: github-app-private-key
        webhookSecretKey: webhook-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RT_GITHUB_CLIENT_ID")].valueFrom.secretKeyRef.name
          value: rt-creds
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RT_GITHUB_CLIENT_ID")].valueFrom.secretKeyRef.key
          value: client-id

  - it: never sets the removed RT_REPOS env
    set:
      config.repos:
        - org/dependent-a
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_REPOS
          any: true

  - it: sources RT_WEBHOOK_SECRET from the existing Secret
    set:
      existingSecret:
        name: rt-creds
        clientIdKey: github-client-id
        privateKeyKey: github-app-private-key
        webhookSecretKey: hook-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RT_WEBHOOK_SECRET")].valueFrom.secretKeyRef.name
          value: rt-creds
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RT_WEBHOOK_SECRET")].valueFrom.secretKeyRef.key
          value: hook-secret

  - it: mounts the App private key from the existing Secret
    set:
      existingSecret:
        name: rt-creds
        clientIdKey: github-client-id
        privateKeyKey: app-key
        webhookSecretKey: webhook-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: github-app-key
            mountPath: /etc/renovate-trigger
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: rt-creds
      - equal:
          path: spec.template.spec.volumes[0].secret.items[0].key
          value: app-key
      - equal:
          path: spec.template.spec.volumes[0].secret.items[0].path
          value: github-app.pem

  - it: runs with a hardened security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  # The chart-level backwards-compatibility guard: a GitHub-only install must not
  # gain any AWS env, so an existing deployment is byte-identical after upgrade.
  - it: sets no ECR or AWS env by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: RT_ECR_QUEUE_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: RT_AWS_REGION
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: RT_ECR_DEPENDENTS_TAG
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: AWS_EC2_METADATA_DISABLED

  - it: wires the ECR event source into the container env when enabled
    set:
      config.ecr.enabled: true
      config.ecr.queueUrl: https://sqs.eu-west-1.amazonaws.com/123456789012/renovate-trigger-ecr-image-push
      config.ecr.region: eu-west-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_ECR_QUEUE_URL
            value: https://sqs.eu-west-1.amazonaws.com/123456789012/renovate-trigger-ecr-image-push
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_AWS_REGION
            value: eu-west-1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_ECR_DEPENDENTS_TAG
            value: renovate-trigger/dependents
      # Pod Identity or nothing: never the node instance profile.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_EC2_METADATA_DISABLED
            value: "true"

  - it: honours a custom dependents tag key
    set:
      config.ecr.enabled: true
      config.ecr.queueUrl: https://sqs.eu-west-1.amazonaws.com/123456789012/q
      config.ecr.region: eu-west-1
      config.ecr.dependentsTag: nobi.life/dependents
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RT_ECR_DEPENDENTS_TAG
            value: nobi.life/dependents
